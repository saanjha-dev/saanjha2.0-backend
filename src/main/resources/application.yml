server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: saanjha-backend

  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: SaanjhaHikariPool
      minimum-idle: 2
      maximum-pool-size: 15
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    # FIX (TD6/S4): 'validate' is now the repo-wide default in every profile.
    # Flyway is the single source of truth for schema shape, per MES Part 1
    # ("One Flyway-managed schema per module"). Hibernate auto-DDL running
    # alongside Flyway silently drifts a developer's local DB from what
    # `flyway migrate` alone would produce — 'update' is now opt-in, in
    # application-dev.yml only, never the shared default.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        generate_statistics: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/auth_,classpath:db/migration/usr_,classpath:db/migration/prj_,classpath:db/migration/app_,classpath:db/migration/tem_,classpath:db/migration/tsk_,classpath:db/migration/con_
    # FIX (TD7/S5): clean-on-validation-error and out-of-order are no longer
    # set here. Both default to Flyway's own safe defaults (false) unless a
    # profile explicitly opts in — see application-dev.yml. Neither should
    # ever be reachable outside a disposable local sandbox; the previous
    # single-file config made both reachable everywhere, including prod.

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 2000
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000
          max-attempts: 3
          multiplier: 2.0

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_ID}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# ---------------------------------------------------------------------------
# CUSTOM APPLICATION PROPERTIES
# ---------------------------------------------------------------------------
app:
  jwt:
    # FIX (TD12/S10): the unused HMAC `secret` key that used to live here has
    # been deleted. JwtProvider uses only the RS256 key pair (rsa.private-key
    # / rsa.public-key below) — this was dead configuration that risked being
    # "helpfully" wired back up by a future contributor who didn't know it
    # was inert.
    expiration-ms: 900000
    refresh-expiration-ms: 604800000

  security:
    # FIX (TD8/S6): no wildcard default here anymore. Every profile must set
    # its own explicit allow-list — see application-dev.yml (permissive, for
    # local network testing only) and application-prod.yml (real origins).
    # Leaving this unset in the base file makes "did you configure this for
    # your environment" a startup-time question instead of a silent wildcard.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allow-credentials: true

  cloudinary:
    cloud-name: ${CLOUD_NAME}
    api-key: ${CLOUD_API_KEY}
    api-secret: ${CLOUD_API_SECRET}

rsa:
  private-key: classpath:keys/private.pem
  public-key: classpath:keys/public.pem

# ---------------------------------------------------------------------------
# OBSERVABILITY & MONITORING
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus, info
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
